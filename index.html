<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Assignment1: Button Component</title>
        <link href="style.css" rel="stylesheet" />
    </head>
    <body>
            <h1>Button Component</h1>

                <h2>Primary Button</h2>
                <button class="c-button c-button--primary" type="button">
                    Primary Button
                </button>

                <h2>Secondary Button</h2>
                <button class="c-button c-button--secondary" type="button">
                    Secondary Button
                </button>

                <h2>Disabled Button</h2>
                <button class="c-button c-button--disabled" disabled>
                    Disabled Button
                </button>

                <h2>Outline Button</h2>
                <button class="c-button c-button--outline" type="button">
                    Outline Button
                </button>
    </body>
</html>
